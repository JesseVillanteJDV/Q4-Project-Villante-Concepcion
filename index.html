<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container">
    <div class="card login-card p-4 text-center">
    <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/8b5611eb-ff3a-407f-9adc-e116a23373fc/OBMC+LOGO+2024-04.png" alt="Logo" width="70" class="mx-auto mb-3">
    <h2>Log in to your Account</h2>
    <div class="text-start mt-3">
    <label class="small fw-bold">Username</label>
    <input type="text" id="username" class="form-control" placeholder="Enter here">
    <label class="small fw-bold mt-2">Password</label>
    <input type="password" id="password" class="form-control" placeholder="********">
    </div>
    <div class="form-check text-start my-3">
    <input type="checkbox" class="form-check-input" id="stay">
    <label class="form-check-label small" for="stay">Stay logged In?</label>
    </div>
    <button id="loginBtn" onclick="checkLogin()" class="btn btn-info w-100 text-white">Log In</button>
    <p id="loginFeedback" class="text-danger small mt-2 fw-bold"></p>
    <a href="#" class="btn btn-link btn-sm mt-2 text-secondary text-decoration-none">Forgot Username / Password?</a>
    </div>
    </div>
    <script src="proj.js"></script>
</body>
</html>
